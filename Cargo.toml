[package]
name = "latte-cli"
description = "A database benchmarking tool for Apache Cassandra and ScyllaDB"
version = "0.54.0-scylladb"
authors = ["Piotr Kołaczkowski <pkolaczk@gmail.com>"]
edition = "2021"
readme = "README.md"
license = "Apache-2.0"
default-run = "latte"

[[bin]]
name = "latte"
path = "src/main.rs"
required-features = ["cql"]

[[bin]]
name = "latte-alternator"
path = "src/main.rs"
required-features = ["alternator"]

[dependencies]
latte-core = { path = "latte-core", default-features = false, features = ["mimalloc"] }
futures = "0.3"
openssl = { version = "0.10.80", optional = true }
scylla = { version = "1.9.0", features = ["openssl-010", "chrono-04"], optional = true }
url = { version = "2.5", optional = true }
aws-sdk-dynamodb = { version = "1.124.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-config = { version = "1.8.16", optional = true }
aws-smithy-types = { version = "1", optional = true }
alternator-client = { version = "1.0.0", optional = true }
base64 = { version = "0.22", optional = true }
serde_json = "1.0"
# NOTE: Using tokio_unstable + enable_alt_timer() to work around the timer performance
#       regression in 1.45+. See: https://github.com/tokio-rs/tokio/issues/7744
#       Alt timer PR: https://github.com/tokio-rs/tokio/pull/7467
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "time", "parking_lot", "signal", "sync"] }

[dev-dependencies]
clap = "4"
criterion = { version = "0.5", default-features = false }
tempfile = "3"
testcontainers = "0.27"
tokio = { version = "1.54.1", features = ["rt", "test-util", "macros"] }

[[bench]]
name = "host"
harness = false

[features]
default = ["cql"]
cql = ["latte-core/cql", "scylla", "openssl"]
alternator = [
    "latte-core/alternator",
    "alternator-client",
    "aws-sdk-dynamodb",
    "aws-config",
    "aws-smithy-types",
    "base64",
    "url",
]

[workspace]
members = ["latte-core"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(fetch_extended_version_info)',
    'cfg(tokio_unstable)',
] }

[profile.release]
codegen-units = 1
lto = true
panic = "unwind"

[profile.dev-opt]
inherits = "dev"
opt-level = 2

[package.metadata.deb]
name = "latte"
maintainer = "Piotr Kołaczkowski <pkolaczk@gmail.com>"
copyright = "2020, Piotr Kołaczkowski <pkolaczk@gmail.com>"
license-file = ["LICENSE", "4"]
extended-description = """
A database benchmarking tool for Apache Cassandra.
Runs CQL queries in parallel, measures throughput and response times.
Can compute statistical significance of differences between two runs.
"""
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
    ["target/release/latte", "usr/bin/", "755"],
    ["workloads/basic/*.rn", "/usr/share/latte/workloads/basic/", "644"],
    ["workloads/sai/new/*.rn", "/usr/share/latte/workloads/sai/new/", "644"],
    ["workloads/sai/orig/*.rn", "/usr/share/latte/workloads/sai/orig/", "644"],
    ["README.md", "usr/share/doc/latte/README", "644"],
]

[patch.crates-io]
# Replace vulnerable atty (CVE: potential unaligned read) with a safe stub
# using std::io::IsTerminal (stable since Rust 1.70)
atty = { path = "crates/atty-stub" }
