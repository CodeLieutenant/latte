[package]
name = "latte-core"
description = "Latte benchmark core: CLI, Rune scripting, scheduling, statistics and reports behind a driver-neutral op boundary"
version = "0.54.0-scylladb"
authors = ["Piotr Kołaczkowski <pkolaczk@gmail.com>"]
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mimalloc = { version = "0.1", default-features = false, optional = true }
jemallocator = { version = "0.5", optional = true }
anyhow = "1.0"
base64 = "0.22"
bytes = "1.11.1"
rmp = "0.8"
rmp-serde = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "cargo", "env"] }
console = "0.15.0"
cpu-time = "1.0.0"
futures = "0.3"
hdrhistogram = "7.1.0"
hytra = "0.1.2"
itertools = "0.14"
lazy_static = "1.4.0"
metrohash = "1.0"
more-asserts = "0.3"
num_cpus = "1.13.0"
once_cell = "1.21"
humantime = "2"
plotters = { version = "0.3", default-features = false, features = ["line_series", "svg_backend", "full_palette"] }
rand = { version = "0.9.4", default-features = false, features = ["small_rng", "std", "thread_rng"] }
rand_distr = "0.5"
regex = "1.5"
regex-automata = "0.4"
rustc-hash = "2"
quanta = "0.12"
rune = "0.14.2"
rust_decimal = "1.36"
rust-embed = "8"
scylla-cql-core = { version = "1.9.0", features = ["chrono-04"] }
search_path = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
status-line = "0.2.0"
strum = { version = "0.26", features = ["derive"] }
time = "0.3"
thiserror = "2.0.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
try-lock = "0.2.3"
uuid = { version = "1.1", features = ["v4"] }
walkdir = "2"

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }
reqwest = { version = "0.13", features = ["json", "blocking"] }
serde_json = "1.0"
chrono = "0.4.9"
cargo-lock = "11.0.0"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
assert_approx_eq = "1"
tempfile = "3"
rstest = "0.22"

[[bench]]
name = "core"
harness = false

[features]
default = ["cql", "mimalloc"]
cql = []
alternator = []
# The global allocator of every build that links latte-core: the cdylib and the Rust host.
# `jemalloc` is for allocator benchmarks only.
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:jemallocator"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fetch_extended_version_info)'] }
